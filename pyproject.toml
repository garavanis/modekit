[project]
name = "modekit"
version = "0.2.0"
description = "Modal analysis in JAX: modal parameters from input-output tests or from output-only measurements"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Giorgos Aravanis", email = "georgios.aravanis@polimi.it" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib>=3.7",
    "pandas>=3.0.3",
    "jax",
    "equinox>=0.13.8",
    "tqdm",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5"]  # export.save_table(..., fmt="excel")

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "nbstripout>=0.9.1",
    "ipykernel",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
